<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Janken Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
      }

      /* Pyxel画面の拡大設定（trick_or_track と同じ方向性） */
      pyxel-run, canvas {
        image-rendering: pixelated;
        cursor: none !important;

        /* 画面の短辺に合わせて最大化（4:3の比率を維持） */
        width: 100vmin;     /* 横幅：画面の短い方いっぱい */
        height: 75vmin;     /* 縦幅：4:3 になるように設定（100 * 0.75） */

        display: block;
      }

      /* 中央に配置 */
      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
    </style>
  </head>

  <body>
    <div id="wrap">
      <pyxel-run root="." name="main.py"></pyxel-run>
    </div>
  </body>
</html>
