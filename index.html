<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Janken Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
      }
      pyxel-run, canvas {
        image-rendering: pixelated;
        cursor: none !important;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
    </style>
  </head>

  <body>
    <!-- 🔥 BGM -->
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <div id="wrap">
      <pyxel-run root="." name="main.py" gamepad="enabled"></pyxel-run>
    </div>

    <script>
      const bgm = document.getElementById("bgm");
      let started = false;

      // 1回だけBGM再生の許可を取る（iPhone対策）
      const startBgm = () => {
        if (!started) {
          bgm.volume = 1.0;
          bgm.play();
          started = true;
        }
      };
      window.addEventListener("touchstart", startBgm, { once: true });
      window.addEventListener("mousedown", startBgm, { once: true });

      // 🔥 Pyxel の scene を監視する
      let pyxelObj = null;

      // PyxelRun が読み込まれたら取得
      window.addEventListener("pyxel_loaded", (e) => {
        pyxelObj = e.detail.pyxel;
      });

      // 🔥 毎フレーム scene をチェックして音量調整
      setInterval(() => {
        if (!pyxelObj) return;

        // Python側の変数「scene」を読む
        let scene = pyxelObj.globals.scene;

        if (scene === 1) {
          // GAME画面 → ミュート
          bgm.volume = 0.0;
        } else {
          // それ以外（TITLE / HOW TO）→ 音量ON
          bgm.volume = 1.0;
        }
      }, 100);
    </script>
  </body>
</html>
