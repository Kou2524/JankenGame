<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>じゃんけんゲーム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
      pyxel-run, canvas {
        image-rendering: pixelated;
      }
      #hint {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: end center;
        padding-bottom: 24px;
        color: #bbb;
        font: 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #title {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: start center;
        padding-top: 28vh;
        color: #fff;
        font: 24px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: .08em;
        text-shadow: 0 2px 0 #0007;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <pyxel-run root="." name="main.py"></pyxel-run>
      <div id="title">じゃんけんゲーム</div>
      <div id="hint">TAP PAGE TO PLAY BGM</div>
    </div>
  </body>
</html>
