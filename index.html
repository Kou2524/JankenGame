<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Janken Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Pyxel WASM -->
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }

      pyxel-run, canvas {
        image-rendering: pixelated;
      }

      /* Pyxel の下に勝手に出る "Tap / Enter to Start" を隠す */
      pyxel-run::after {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="wrap">
      <pyxel-run 
        root="." 
        name="main.py"
        gamepad="enabled"
        touchpad="enabled"
      ></pyxel-run>
    </div>

    <script>
      /* ====== BGM 切り替え用 set_bgm_scene ======
         index.html 側で JS → Pyxel に音量設定を渡してる。
      */
      let bgm1 = new Audio("bgm1.mp3");
      let bgm2 = new Audio("bgm2.mp3");

      bgm1.loop = true;
      bgm2.loop = true;

      // 音量を 0.5 に設定
      bgm1.volume = 0.5;
      bgm2.volume = 0.5;

      function stopAllBGM() {
        bgm1.pause(); bgm1.currentTime = 0;
        bgm2.pause(); bgm2.currentTime = 0;
      }

      // Pyxel側から呼ばれる
      window.set_bgm_scene = function (scene) {
        stopAllBGM();

        if (scene === 0) {
          bgm1.play();
        } else if (scene === 1) {
          bgm2.play();
        } else if (scene === 2) {
          bgm1.play();   // HOW TOもbgm1
        }
      };
    </script>
  </body>
</html>
