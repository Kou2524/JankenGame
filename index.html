<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Janken Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Pyxel WASM -->
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }

      pyxel-run, canvas {
        image-rendering: pixelated;
      }

      /* Pyxel の下に勝手に出る "Tap / Enter to Start" を隠す */
      pyxel-run::after {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div id="wrap">
      <pyxel-run 
        root="." 
        name="main.py"
        gamepad="enabled"
        touchpad="enabled"
      ></pyxel-run>
    </div>

    <script>
      /* ====== BGM 切り替え（iOS/Safari対策入り） ====== */

      let bgm1 = new Audio("bgm1.mp3");
      let bgm2 = new Audio("bgm2.mp3");

      bgm1.loop = true;
      bgm2.loop = true;

      bgm1.volume = 0.25;
      bgm2.volume = 0.25;

      let audioUnlocked = false;   // 1回でもユーザー操作があったか
      let pendingScene = 0;        // 解禁前に要求されたsceneを記憶

      function stopAllBGM() {
        bgm1.pause(); bgm1.currentTime = 0;
        bgm2.pause(); bgm2.currentTime = 0;
      }

      function playScene(scene) {
        stopAllBGM();

        let target = null;
        if (scene === 0) target = bgm1;
        else if (scene === 1) target = bgm2;
        else if (scene === 2) target = bgm1;
    
        if (!target) return;

        // iOSはplay()がPromiseで失敗することあるから握りつぶす
        target.play().catch(() => {});
      }

      // Pyxel側から呼ばれる
      window.set_bgm_scene = function (scene) {
        pendingScene = scene;

        // まだ解禁されてないなら「覚えるだけ」で再生しない
        if (!audioUnlocked) return;

        playScene(scene);
      };

　　　　  // ユーザー操作が来た瞬間に音を解禁して、保留中のBGMを流す
      function unlockAudioOnce() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        playScene(pendingScene);
      }

      // どれか1回でOK（iPhone用にtouchstartも入れる）
      window.addEventListener("pointerdown", unlockAudioOnce, { once: true });
      window.addEventListener("touchstart", unlockAudioOnce, { once: true });
      window.addEventListener("keydown", unlockAudioOnce, { once: true });
　　　　</script>
  </body>
</html>
