<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Janken Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
      }
      pyxel-run, canvas {
        image-rendering: pixelated;
        cursor: none !important;
      }
      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
    </style>
  </head>

  <body>
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <div id="wrap">
      <pyxel-run root="." name="main.py" gamepad="enabled"></pyxel-run>
    </div>

    <script>
      const bgm = document.getElementById("bgm");
      let startedByUser = false;

      const startUserInit = () => {
        if (!startedByUser) {
          bgm.volume = 1.0;
          bgm.play();
          startedByUser = true;
        }
      };

      window.addEventListener("touchstart", startUserInit, { once: true });
      window.addEventListener("mousedown", startUserInit, { once: true });

      window.addEventListener("message", (e) => {
        if (e.data === "bgm:start") {
          bgm.currentTime = 0;
          bgm.play();
        }
        if (e.data === "bgm:stop") {
          bgm.pause();
        }
      });
    </script>
  </body>
</html>
