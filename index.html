<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Janken Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Pyxel WASM -->
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel/wasm/pyxel.js"></script>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000;
        height: 100%;
        overflow: hidden;
      }

      /* Pyxel を中央に表示 + ピクセル保持 + カーソル非表示 */
      pyxel-run, canvas {
        image-rendering: pixelated;
        cursor: none !important;   /* ← カーソル非表示！ */
      }

      #wrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
    </style>
  </head>

  <body>
    <div id="wrap">
      <!-- Pyxel の Python ファイルを読み込む -->
      <!-- root="." は index.html と同じフォルダを参照 -->
      <pyxel-run root="." name="main.py"></pyxel-run>
    </div>
  </body>
</html>
